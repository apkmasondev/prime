name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer commit waits rather than cancelling a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds and serves at the root, which is what `vite preview` expects.
      - name: Smoke tests
        run: npm run test:e2e

      - name: Failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Rebuilt with the real public path and absolute social URLs. The smoke
      # tests above deliberately build without these, because `vite preview`
      # serves from the root.
      - name: Build for Pages
        env:
          # A project site is served from /<repo>/; a user or organisation site from root.
          BASE_PATH: >-
            ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner)
                && '/'
                || format('/{0}/', github.event.repository.name) }}
          SITE_URL: >-
            https://${{ github.repository_owner }}.github.io${{
              github.event.repository.name == format('{0}.github.io', github.repository_owner)
                && '/'
                || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
