        <h1>PRIME — A Short Walk Through Infinity</h1>
        <p>
          This is a scroll-driven film. It needs JavaScript to run, but the mathematics does not:
        </p>
        <ol>
          <li><strong>Exactly two divisors.</strong> A prime is a whole number greater than 1 divisible only by 1 and itself. 2 is the only even prime.</li>
          <li><strong>The sieve of Eratosthenes.</strong> Strike out every multiple of each prime in turn; what survives is prime.</li>
          <li><strong>There is no last prime.</strong> Multiply any finite list of primes together and add one. The result leaves a remainder of 1 when divided by each of them, so it is prime itself or has a prime factor the list never held.</li>
          <li><strong>Irregular is not structureless.</strong> Wind the whole numbers into a square spiral, mark the primes, and diagonal streaks appear.</li>
          <li><strong>The atoms of arithmetic.</strong> Every whole number above 1 is a product of primes, in exactly one way apart from order. 84 = 2 × 2 × 3 × 7.</li>
          <li><strong>Easy to multiply, hard to undo.</strong> Large primes power classic public-key systems such as RSA.</li>
        </ol>
      </div>
